name: Publish RZA lesson

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      prepare_only:
        description: 'Prepare and save lessons without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rza-channel-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify and build
        run: |
          go test ./...
          go build -o publisher .
      - name: Check required secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo 'Add the TELEGRAM_BOT_TOKEN repository Actions secret before running the publisher.'
            exit 1
          fi
      - name: Prepare free course continuation
        run: ./publisher -prepare -buffer 6
      - name: Reserve next lesson and persist before sending
        env:
          TELEGRAM_CHANNEL: '@rza_school'
          PREPARE_ONLY: ${{ inputs.prepare_only || false }}
        run: |
          if [ "$PREPARE_ONLY" != "true" ]; then
            ./publisher -reserve
          fi
          git config user.name 'rza-publisher[bot]'
          git config user.email 'rza-publisher@users.noreply.github.com'
          git add posts/lessons
          if [ -f .publisher-state.json ]; then
            git add .publisher-state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare course continuation and reserve next RZA lesson'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - name: Publish reserved lesson
        if: ${{ inputs.prepare_only != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@rza_school'
        run: ./publisher -deliver
      - name: Save delivery result
        if: ${{ always() }}
        run: |
          if [ -f .publisher-state.json ]; then
            git config user.name 'rza-publisher[bot]'
            git config user.email 'rza-publisher@users.noreply.github.com'
            git add .publisher-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save RZA publication result'
              git push origin HEAD:${{ github.event.repository.default_branch }}
            fi
          fi
