name: Publish RZA lesson

on:
  workflow_dispatch:
    inputs:
      prepare_only:
        description: 'Prepare and save lessons without publishing'
        required: false
        default: false
        type: boolean
      target_total:
        description: 'Catch up to this total number of published lessons (0 = normal batch)'
        required: false
        default: 0
        type: number

permissions:
  contents: write

concurrency:
  group: rza-channel-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media renderer
        run: |
          python3 -m pip install -r media/requirements.txt
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi
      - name: Verify and build
        run: |
          go test ./...
          go build -o publisher .
          bash .github/scripts/test-publish-batch.sh
          python3 .github/scripts/test_resolve_batch.py
          python3 media/test_render.py
          python3 .github/scripts/test_review_editorial.py
          python3 .github/scripts/test_publish_hourly.py
          python3 media/render.py --file posts/lessons/001-purpose.txt --output-dir media/generated > /dev/null
          python3 media/render.py --file posts/lessons/080-auto.txt --output-dir media/generated > /dev/null
      - name: Check required secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo 'Add the TELEGRAM_BOT_TOKEN repository Actions secret before running the publisher.'
            exit 1
          fi
      - name: Prepare reviewed advanced series
        run: ./publisher -prepare
      - name: Review queue and Telegram cards
        run: python3 .github/scripts/review_editorial.py
      - name: Save prepared lessons
        run: |
          git config user.name 'rza-publisher[bot]'
          git config user.email 'rza-publisher@users.noreply.github.com'
          git add posts/lessons
          if [ -f .publisher-state.json ]; then
            git add .publisher-state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Save prepared RZA lessons'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - name: Resolve publication count
        id: batch
        env:
          TARGET_TOTAL: ${{ inputs.target_total || 0 }}
        run: |
          count=$(python3 .github/scripts/resolve_batch.py)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Publish lessons
        if: ${{ inputs.prepare_only != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@rza_school'
          POSTS_PER_RUN: ${{ steps.batch.outputs.count }}
          TARGET_TOTAL: ${{ inputs.target_total || 0 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/publish_hourly.py
      - name: Save delivery result
        if: ${{ always() }}
        run: |
          if [ -f .publisher-state.json ]; then
            git config user.name 'rza-publisher[bot]'
            git config user.email 'rza-publisher@users.noreply.github.com'
            git add .publisher-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save RZA publication result'
              git push origin HEAD:${{ github.event.repository.default_branch }}
            fi
          fi
